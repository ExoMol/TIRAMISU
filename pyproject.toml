[project]
name = "tiramisu"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.1",
    "astropy>6.1.4",
    "scipy>1.14.0",
    "molmass>2024.5.24",
    "h5py>3.11.0",
    "pandas>2.2.2",
    "tqdm>4.66.4",
    "numba>=0.61.0",
    "matplotlib>=3.10.1",
    "polars>=1.37.1",
    "phoenix4all>=0.0.4",
    "dask>=2026.1.1",
    "pyarrow>=19",
]

[project.optional-dependencies]
# Documentation build (also what ReadTheDocs installs). It needs no TBB: source/conf.py selects numba's workqueue
# threading layer, since building the docs runs no parallel kernels.
docs = [
    "sphinx>=8",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[dependency-groups]
dev = [
    "matplotlib>3.9.1",
    "ipython>8.26.0"
]

[tool.setuptools.packages.find]
include = ["tiramisu*"]
